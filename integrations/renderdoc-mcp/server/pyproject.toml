[project]
name = "renderdoc-mcp"
version = "1.5.0"
description = "A full-featured MCP server for RenderDoc GPU capture analysis"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
]

[project.scripts]
renderdoc-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
